[package]
name = "dcc_sph"
version = "0.1.0"
authors = ["Jacob Everist <jacob.everist@gmail.com>"]
edition = "2021"
description = "Sparse Predictive Hierarchies (SPH) — clean-room Rust port of AOgmaNeo"
readme = "README.md"
repository = "https://github.com/jacobeverist/dcc-sph"
keywords = ["machine-learning", "neuroscience", "sph", "online-learning"]
categories = ["science", "algorithms"]

# CC BY-NC-SA 4.0 — the SAME license as upstream AOgmaNeo, which its ShareAlike
# term requires of adapted material, and a Rust port is adapted material. Note it
# is NONCOMMERCIAL: that restriction travels with this crate into anything that
# links it. Attribution is a CONDITION of the grant, not a courtesy — see
# PROVENANCE.md, which carries the notices §3(a) requires.
license = "CC-BY-NC-SA-4.0"

# Copyright (c) 2026 Jacob Everist, for the Rust port. AOgmaNeo itself is
# © 2020-2025 Ogma Intelligent Systems Corp — that notice is upstream's and is
# reproduced verbatim in PROVENANCE.md and AOGMANEO_LICENSE.md, never edited.

[dependencies]
rayon = "1"
# Optional, and only for the two Gymnasium example runners. It stays optional so a
# normal build (and every consumer of this crate) pulls no Python at all.
#
# This used to carry a note about staying in lockstep with dcc-core's Python
# binding, because pyo3 sets `links = "python"` and a cargo workspace may contain
# exactly one pyo3. Extraction dissolved that constraint: this crate is no longer
# in that workspace, and with the feature off pyo3 never enters a consumer's graph.
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }

# Optional, and only for the windowed shells of the demo examples. The demos all
# run headless and text-only without it; this exists so a demo can be eyeballed
# quickly, not as instrumentation — that is dcc-dashboard's job. Optional for the
# same reason pyo3 is: a normal build, and every consumer of this crate, pulls no
# windowing or GL at all.
macroquad = { version = "0.4", optional = true }

# Lint policy, in the manifest rather than in lib.rs so it reaches examples, tests
# and benches too — the lints below fire mostly in exactly those targets.
#
# This crate is a TRANSLITERATION of AOgmaNeo's C++, and that is the point: module
# names, function names and loop structure deliberately mirror the original so
# `doc/MethodFidelity.md` can be audited method by method. `t % 20 == 0` reads the
# same in both languages; `t.is_multiple_of(20)` reads better as Rust and worse as a
# comparison against the source it is supposed to mirror.
[lints.clippy]
manual_is_multiple_of = "allow"
needless_range_loop = "allow"

[dev-dependencies]
# Fidelity harness: JSON golden fixtures (serde) for the C++ parity test.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

# Decodes the two vendored track bitmaps for the `car_racing` demo. A
# dev-dependency, not an optional dependency: cargo builds these only for
# examples, tests and benches, so no consumer of the crate ever pulls it and the
# published dependency graph is unchanged. That is also what lets the demos run
# headless with no features enabled.
png = "0.17"

# Only the `runner` demo needs this. Every other demo's physics is hand-written in
# tens of lines, but the runner is a genuinely articulated body — four limbs of two
# segments, eight revolute motors with angle limits and torque caps, contact
# sensing and world raycasts — and reimplementing a constraint solver for one demo
# would be its own project. A dev-dependency for the same reason as `png`.
rapier2d = "0.35"

[[bench]]
name = "sph_benchmarks"
harness = false

[features]
# Needs a Python environment with `gymnasium[box2d]` as well as the crate feature,
# so it is not part of `--all-features` in CI.
gymnasium-examples = ["dep:pyo3"]

# Opens a window for the demo examples. Kept out of `--all-features` in CI for the
# same reason as above: a headless runner has no display to open one on. The
# demos' default path needs no feature at all.
macroquad-demos = ["dep:macroquad"]

[[example]]
name = "fidelity_dump"
path = "examples/fidelity_dump.rs"

# --- Demos ported from OgmaNeoDemos (see doc/Demos.md) ---
#
# Declared explicitly rather than auto-discovered so the demo suite is legible
# from the manifest. They share `examples/support/`, which cargo ignores as a
# target because it has no `main.rs`; each demo pulls it in with `#[path]`, the
# same idiom `fidelity_dump` uses for `tests/support/`.
#
# None of these require a feature: headless and text-only is the default path.

[[example]]
name = "wavy_line"

[[example]]
name = "wavy_classify"

[[example]]
name = "ball_physics"

[[example]]
name = "enc_vis"

[[example]]
name = "topo_test"

[[example]]
name = "pusher"

[[example]]
name = "cat_mouse"

[[example]]
name = "cat_mouse_pos"

[[example]]
name = "car_racing"

[[example]]
name = "runner"

# The whole of the graphics feature: one window onto three of the demos. The other
# six are text-only by design.
[[example]]
name = "viewer"
required-features = ["macroquad-demos"]

[[example]]
name = "cartpole_env_runner"
required-features = ["gymnasium-examples"]

[[example]]
name = "lunarlander"
required-features = ["gymnasium-examples"]

# Standalone workspace root — this crate is no longer a member of the dcc-core
# workspace. An empty [workspace] tells cargo to treat this manifest as its own
# root rather than searching upwards.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
incremental = true
