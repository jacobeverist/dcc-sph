[package]
name = "dcc_sph"
version = "0.1.0"
authors = ["Jacob Everist <jacob.everist@gmail.com>"]
edition = "2021"
description = "Sparse Predictive Hierarchies (SPH) — clean-room Rust port of AOgmaNeo"
readme = "README.md"
repository = "https://github.com/jacobeverist/dcc-sph"
keywords = ["machine-learning", "neuroscience", "sph", "online-learning"]
categories = ["science", "algorithms"]

# CC BY-NC-SA 4.0 — the SAME license as upstream AOgmaNeo, which its ShareAlike
# term requires of adapted material, and a Rust port is adapted material. Note it
# is NONCOMMERCIAL: that restriction travels with this crate into anything that
# links it. Attribution is a CONDITION of the grant, not a courtesy — see
# PROVENANCE.md, which carries the notices §3(a) requires.
license = "CC-BY-NC-SA-4.0"

# Copyright (c) 2026 Jacob Everist, for the Rust port. AOgmaNeo itself is
# © 2020-2025 Ogma Intelligent Systems Corp — that notice is upstream's and is
# reproduced verbatim in PROVENANCE.md and AOGMANEO_LICENSE.md, never edited.

[dependencies]
rayon = "1"

# NOTE: there is deliberately no `pyo3` here, and there must not be one.
#
# It sat here as an optional dependency for the two Gymnasium example runners until
# 2026-08-12. `pyo3-ffi` sets `links = "python"`, and cargo permits at most one package
# with a given `links` value in an ENTIRE dependency graph — so two pyo3 majors are
# unresolvable, not merely duplicated. dcc-core's Python binding links the whole engine
# graph including this crate, which meant the two repositories had to keep pyo3 majors
# in lockstep. That worked only because they happened to match.
#
# The runners now live in `examples-gym/`, a workspace member that nothing depends on,
# so pyo3 never enters a consumer's graph at all. See doc/Conformance.md (R11, R16).

# NOTE: there is deliberately no graphics dependency here. The windowed demo viewer
# lives in `examples-viz/`, a separate crate, so `macroquad` never enters this
# package's `[dependencies]` at all — see R16 in doc/Conformance.md and the
# rationale in examples-viz/Cargo.toml. `rayon` is this crate's only runtime
# dependency, and doc/Conformance.md's R10 note depends on it staying that way;
# `r10_runtime_dependencies_stay_minimal` pins it.

# Lint policy, in the manifest rather than in lib.rs so it reaches examples, tests
# and benches too — the lints below fire mostly in exactly those targets.
#
# This crate is a TRANSLITERATION of AOgmaNeo's C++, and that is the point: module
# names, function names and loop structure deliberately mirror the original so
# `doc/MethodFidelity.md` can be audited method by method. `t % 20 == 0` reads the
# same in both languages; `t.is_multiple_of(20)` reads better as Rust and worse as a
# comparison against the source it is supposed to mirror.
# Defined once at workspace level and inherited by both packages, because
# `examples/support/` is compiled by both and a lint policy does not cross a crate
# boundary on its own.
[lints]
workspace = true

[dev-dependencies]
# Fidelity harness: JSON golden fixtures (serde) for the C++ parity test.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

# Decodes the two vendored track bitmaps for the `car_racing` demo. A
# dev-dependency, not an optional dependency: cargo builds these only for
# examples, tests and benches, so no consumer of the crate ever pulls it and the
# published dependency graph is unchanged. That is also what lets the demos run
# headless with no features enabled.
png = "0.17"

# Only the `runner` demo needs this. Every other demo's physics is hand-written in
# tens of lines, but the runner is a genuinely articulated body — four limbs of two
# segments, eight revolute motors with angle limits and torque caps, contact
# sensing and world raycasts — and reimplementing a constraint solver for one demo
# would be its own project. A dev-dependency for the same reason as `png`.
rapier2d = "0.35"

[[bench]]
name = "sph_benchmarks"
harness = false

# Learning-outcome assertions, deliberately NOT run by `cargo test`.
#
# `test = false` removes this target from `cargo test`, `cargo test --all-targets`
# and `cargo test --release`; `cargo test --test learning` still selects it by
# name. That is stronger than `#[ignore]`, which is one deleted attribute away
# from being a CI gate again.
#
# Whether a configuration learns is an experiment, and experiments are the point of
# this repository — they belong in an offline `--repeat`/`--sweep` run at step
# counts a CI runner has no business spending. A learning threshold in CI turns
# every experiment into a build break, and pressures the measurements to flatter.
#
# CI still compiles it (`cargo test --no-run --test learning`) so it cannot rot.
[[test]]
name = "learning"
test = false

[[example]]
name = "fidelity_dump"
path = "examples/fidelity_dump.rs"

# --- Demos ported from OgmaNeoDemos (see doc/Demos.md) ---
#
# Declared explicitly rather than auto-discovered so the demo suite is legible
# from the manifest. They share `examples/support/`, which cargo ignores as a
# target because it has no `main.rs`; each demo pulls it in with `#[path]`, the
# same idiom `fidelity_dump` uses for `tests/support/`.
#
# None of these require a feature: headless and text-only is the default path.

[[example]]
name = "wavy_line"

[[example]]
name = "wavy_classify"

[[example]]
name = "ball_physics"

[[example]]
name = "video_prediction"

[[example]]
name = "vsa_char"

[[example]]
name = "enc_vis"

[[example]]
name = "topo_test"

[[example]]
name = "pusher"

[[example]]
name = "cat_mouse"

[[example]]
name = "cat_mouse_pos"

[[example]]
name = "explore"

[[example]]
name = "car_racing"

[[example]]
name = "runner"

[[example]]
name = "stacking_rl"

[[example]]
name = "stacking_prog"

# RUST-ONLY — no OgmaNeoDemos counterpart. This is the shared demo the three ports
# (dcc-sph, dcc-sparsey, dcc-htm) all implement; see doc/Demos.md.
[[example]]
name = "noise_robustness"

# `cartpole_env_runner` and `lunarlander` are NOT declared here. They live in the
# `examples-gym` member crate, which is where `pyo3` went when it left the library
# — see R11/R16 in doc/Conformance.md. Run them with
# `cargo run -p dcc_sph_gym_examples --example cartpole_env_runner`.

# Standalone workspace root — this crate is no longer a member of the dcc-core
# workspace. A [workspace] table tells cargo to treat this manifest as its own root
# rather than searching upwards (R3 in doc/Conformance.md), which is also what stops
# a checkout placed inside another workspace from being absorbed into it.
#
# Both members exist for the same reason and it is R16's: a local application
# belongs in a separate crate rather than behind an optional feature. `examples-viz`
# is where macroquad lives, `examples-gym` is where pyo3 lives, and dcc-core depends
# on the `dcc_sph` package by name, so neither ever enters its graph.
#
# `default-members` is the load-bearing line. Listing those members without it would
# make plain `cargo build` and `cargo test` build the windowed viewer — and therefore
# macroquad, and therefore a GL and windowing stack — and the Python bindings, for
# everyone. Pinning the default to this package alone keeps the ordinary path exactly
# as headless as before; the extras are reached with `-p`.
[workspace]
members = ["examples-viz", "examples-gym"]
default-members = ["."]

# This crate is a TRANSLITERATION of AOgmaNeo's C++, and that is the point: module
# names, function names and loop structure deliberately mirror the original so
# `doc/MethodFidelity.md` can be audited method by method. `t % 20 == 0` reads the
# same in both languages; `t.is_multiple_of(20)` reads better as Rust and worse as a
# comparison against the source it is supposed to mirror. The demo environments are
# transliterations of upstream's C++ too, and `examples-viz` compiles them as well.
[workspace.lints.clippy]
manual_is_multiple_of = "allow"
needless_range_loop = "allow"

# `examples/support/` gates its drawing helpers on
# `#[cfg(feature = "macroquad-demos")]`. That feature exists in `examples-viz`, not
# in the library — deliberately, since the whole point of R16 is that this package
# carries no graphics dependency. Declaring the value tells rustc the cfg is known
# and simply inactive here, rather than a typo. It creates no feature.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("macroquad-demos"))'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
incremental = true
