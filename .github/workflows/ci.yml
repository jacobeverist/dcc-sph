name: CI

# This crate used to be a member of the dcc-core workspace, where `cargo test
# --workspace` ran its suite for free. It is standalone now, so if this file does
# not run the tests, nothing does — and the suite rots invisibly rather than
# failing. That is the whole reason this exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # R12 of dcc-core's import contract: this crate must build for wasm32,
          # because dcc-core ships a WebAssembly binding and anything it imports
          # travels there. See doc/Conformance.md.
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      # RAYON_NUM_THREADS=1 is not tidiness. The fidelity comparison is bit-exact
      # against a single-threaded C++ run, and while the parallel paths use
      # deterministic per-column subseeds (so results ARE order-independent), pinning
      # the thread count keeps a failure here meaning "the algorithm changed" rather
      # than "the scheduler differed".
      - name: Test
        env:
          RAYON_NUM_THREADS: 1
        run: cargo test --all-targets

      - name: Test (release)
        env:
          RAYON_NUM_THREADS: 1
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `tests/learning.rs` carries the learning-outcome assertions and is marked
      # `test = false`, so every step above skips it — including `--all-targets`,
      # which honours that flag for both `cargo test` and `cargo clippy`. That is
      # the intent: whether a configuration learns is an offline experiment, not a
      # build gate.
      #
      # Skipped by everything also means unbuilt by everything, and an unbuilt test
      # rots silently. Compile and lint it here, and never run it. Naming the
      # target explicitly is what reaches past `test = false`.
      - name: The offline learning tests still compile
        run: |
          cargo test --no-run --test learning
          cargo clippy --test learning -- -D warnings

      # The demos are headless and text-only by default, so CI can actually run
      # them. Building them is not enough: a demo that panics on step one still
      # compiles.
      #
      # This gate is EXIT CODE ONLY, deliberately. It asks whether each demo sets
      # up, encodes, steps, reports and exits — not whether it learned anything.
      # Whether a configuration learns is an experiment, and experiments are what
      # this repository is for; they belong in an offline run with `--repeat` and
      # `--sweep`, at step counts a CI runner has no business spending, and with a
      # human reading the spread. A CI job that failed on a learning threshold
      # would make every experiment a build break.
      #
      # So the step counts here are deliberately far too small to learn at, and
      # that is the point rather than a compromise: `stacking_prog` reports a
      # NEGATIVE verdict at these budgets and still exits 0, as it should.
      # `runner` is the slow one (rigid-body simulation), so it gets the smallest
      # budget.
      - name: Smoke-run the demos
        env:
          RAYON_NUM_THREADS: 1
        run: |
          set -e
          cargo run --release --example wavy_line     -- --steps 2000 --quiet
          cargo run --release --example wavy_classify -- --train-steps 3000 --test-steps 1000 --hold 500 --quiet
          cargo run --release --example ball_physics  -- --train-episodes 5 --gen-episodes 1 --quiet
          cargo run --release --example video_prediction -- --passes 2 --frame-size 32 --frame-count 30 --gen-frames 20 --quiet
          cargo run --release --example vsa_char      -- --train-steps 3000 --test-steps 500 --quiet
          cargo run --release --example enc_vis       -- --steps 3000 --quiet
          cargo run --release --example topo_test     -- --steps 3000 --quiet
          cargo run --release --example pusher        -- --steps 3000 --baseline-steps 1000 --quiet
          cargo run --release --example cat_mouse     -- --steps 2000 --baseline-steps 500 --quiet
          cargo run --release --example cat_mouse_pos -- --steps 2000 --baseline-steps 500 --quiet
          cargo run --release --example explore       -- --steps 2000 --cells 4 --quiet
          cargo run --release --example car_racing    -- --steps 3000 --baseline-steps 1000 --quiet
          cargo run --release --example runner        -- --steps 1000 --baseline-steps 500 --quiet
          cargo run --release --example stacking_rl   -- --steps 3000 --baseline-steps 1000 --quiet
          # Both goal routes, since `top` is the only demo path through
          # `step_with_goal` and a build that broke it would otherwise still pass.
          cargo run --release --example stacking_rl   -- --steps 2000 --baseline-steps 500 --goal-mode top --quiet
          cargo run --release --example stacking_prog -- --steps 3000 --trials 10 --quiet
          cargo run --release --example stacking_prog -- --steps 3000 --trials 10 --train-policy scripted --quiet

      # Checks the metrics FORMAT, not the metrics. Two properties everything else
      # rests on: the records parse and carry their identifying keys, and the same
      # seed reproduces a run byte for byte — without that second one `--repeat`
      # and `--sweep` compare nothing.
      #
      # No metric VALUE is asserted anywhere here, on purpose. Judging a run by its
      # numbers is the offline experiment's job; see the note on the step above.
      - name: Metrics schema and determinism
        env:
          RAYON_NUM_THREADS: 1
        run: |
          set -e
          cargo run --release --example wavy_line -- --steps 2000 --every 1000 --quiet --metrics a.jsonl
          cargo run --release --example wavy_line -- --steps 2000 --every 1000 --quiet --metrics b.jsonl
          diff a.jsonl b.jsonl
          echo "determinism: metrics are byte-identical across runs at the same seed"
          python3 - <<'EOF'
          import json
          recs = [json.loads(l) for l in open("a.jsonl")]
          kinds = [r["kind"] for r in recs]
          assert kinds[0] == "run", kinds
          assert "summary" in kinds and "verdict" in kinds, kinds
          assert all({"demo", "seed", "run"} <= r.keys() for r in recs)
          print(f"schema: {len(recs)} records, kinds {kinds}")
          EOF

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # R12. This crate has no `rand` dependency — its randomness is the PCG32 in
      # `helpers`, which is what makes bit-exact parity with the AOgmaNeo C++ possible —
      # so `getrandom` never enters the graph and this passes today. The step exists so
      # it keeps passing: the sibling port dcc-sparsey shipped exactly that regression
      # from extraction until 2026-08-12, invisible because dcc-core's own wasm build
      # supplies a backend and masked it.
      #
      # `rayon` compiles for wasm32 with no threads and degrades to serial, which is
      # fine here. If this step fails, the fix is `default-features = false` on whatever
      # was added — NOT selecting a getrandom backend, which is a binary's decision.
      # See doc/Conformance.md.
      - name: Builds for wasm32 (R12)
        run: cargo check --target wasm32-unknown-unknown

      # `cargo tree -d` ALWAYS exits 0 — it REPORTS duplicates, it does not fail on
      # them. So `run: cargo tree -d`, which is what this step was until 2026-08-12,
      # guarded nothing: the job went green with any duplicate at all.
      #
      # Duplicates are not uniformly bad. Two `syn` majors arriving through unrelated
      # proc-macros are ordinary and unfixable from here. Two `serde` or two `rand` are
      # a different thing: the types stop being the same types across the boundary, and
      # a second `rand` is a second RNG stream, which silently unseeds whatever draws
      # from it. So print everything, fail on the short list that actually breaks.
      - name: No duplicate core dependencies
        run: |
          echo "--- all duplicates (informational) ---"
          cargo tree -d || true
          dups=$(cargo tree -d 2>/dev/null \
                 | grep -E '^(serde|rand|rand_core|rand_chacha|rand_xoshiro|schemars|thiserror) v[0-9]' \
                 | sort -u)
          if [ -n "$dups" ]; then
            echo
            echo "FAIL: more than one version of a core dependency is in the graph:"
            echo "$dups"
            exit 1
          fi
          echo
          echo "OK: no duplicate core dependencies"

  # Deliberately NOT part of the job above, and deliberately not `--all-features`:
  # the `gymnasium-examples` feature pulls pyo3 with `auto-initialize`, which needs
  # Python development headers, and the examples themselves need a venv with
  # `gymnasium[box2d]`. Checking that the feature still COMPILES is worth doing;
  # running the examples is not CI's job.
  gymnasium-feature:
    name: gymnasium-examples compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the pyo3-gated examples still build
        run: cargo check --examples --features gymnasium-examples

  # The windowed viewer lives in `examples-viz/`, a separate workspace member, so
  # macroquad is not a dependency of the library at all — R16 in doc/Conformance.md,
  # and the same move the Gymnasium runners are making. `default-members` keeps it
  # out of the job above, so it needs its own build here.
  #
  # Compiling it is the whole check: opening a window is not CI's job, and a runner
  # has no display to open one on.
  viz-crate:
    name: examples-viz compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the X11 and ALSA headers macroquad links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Check the windowed viewer still builds
        run: cargo check -p dcc_sph_viz_examples --examples
